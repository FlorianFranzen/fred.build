# Companies wall: logos only, one neutral group, newest relationship first.
# label: also print the name next to the mark (for abstract marks without a wordmark).
# size: optical scale of the mark relative to the default height (compact icons > 1, heavy wordmarks < 1).
# logo: file in static/logos/ (monochrome SVG with fill="currentColor", see design/clean-logo.py
# and static/logos/SOURCES.md). Without a logo the name is shown as text.


[[service]]
title = "Prototyping and embedded development"
blurb = "Schematic and PCB in KiCad, then the firmware and host software that make the first unit useful: ESP32, Teensy and other microcontrollers, CAN, I²C and SPI, real-time Linux, bring-up and board support."

[[service]]
title = "Protocol research and specification"
blurb = "Specifications that independent teams can implement, with conformance tests to prove it; consensus and cryptography reviews; tokenomics and game-theory checks before a design ships to mainnet."

[[service]]
title = "Scientific computing and computer vision"
blurb = "Acquisition, analysis pipelines and machine learning on the data a lab or product actually produces: electrophysiology, spike sorting, 3-D reconstruction from video, GPU-accelerated where it pays."

[[service]]
title = "Data digitization"
blurb = "Analogue tape recovered into clean digital archives: the RF signal captured with CXADC and decoded with VHS-Decode instead of a capture card, dropouts repaired in software, every file checksummed and documented."

[[service]]
title = "Electronics repair, modification and refurbishment"
blurb = "Component-level repair of lab and studio equipment; consoles and other consumer hardware recapped, modded and upgraded with modchips, HDMI and flash: the work nobody writes service manuals for."

[[service]]
title = "Infrastructure and validator operations"
blurb = "NixOS-declared bare metal and cloud, Kubernetes, CI/CD and the networks underneath; validators and RPC nodes for Substrate and Solana with offline keys. Monitored, documented, handed over runnable."

[[service]]
title = "Security and reverse engineering"
blurb = "Hardening and incident response in operations; binary analysis with Ghidra and IDA Pro, fuzzing and protocol dissection in research; consumer hardware reverse-engineered so it can be extended."

[[service]]
title = "Technical leadership and due diligence"
blurb = "The technical side of product strategy: roadmaps, hiring, partner and exchange integrations; research and code reviews for investors and product teams, and the articles and specifications that follow."

[[service]]
title = "Teaching and workshops"
blurb = "Cryptography, economics and blockchain at the Polkadot Blockchain Academy; 3-D printing, CAD and microcontrollers for TReND in Africa; tutoring and lab courses before that."

